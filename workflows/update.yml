name: 每日更新匯率資料

on:
  schedule:
    # 台北 09:30（UTC 01:30）週一到週五
    - cron: '30 1 * * 1-5'
    # 台北 17:30（UTC 09:30）— 台北收盤後補抓
    - cron: '30 9 * * 1-5'
  workflow_dispatch:        # ← 頁面上「重跑完整更新」按鈕觸發這個

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    # 台銀／證交所／央行會擋境外 IP，需位於台灣的 self-hosted runner。
    # 若暫時沒有，改成 ubuntu-latest 也能跑：其餘來源全部正常，
    # 只有台銀牌告會改用「中價 × 上次加價率」推估，頁面會標示。
    runs-on: ${{ vars.RUNNER_LABEL || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取資料
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          JPY_TARGET: ${{ vars.JPY_TARGET || '4000000' }}
        run: python scripts/fetch_data.py

      - name: 檢查產出
        run: |
          python - <<'PY'
          import json,sys,datetime
          d=json.load(open('data/latest.json',encoding='utf-8'))
          assert d.get('anchor'), '缺 anchor'
          assert d.get('cftc',{}).get('net') is not None, '缺 CFTC'
          assert d.get('conf'), '缺 conformal 區間'
          age=(datetime.date.today()-datetime.date.fromisoformat(d['anchor_date'])).days
          print(f"錨點 {d['anchor_date']}（{age} 天前）· 牌告 {d['board']['spot_sell']} · 警示 {len(d.get('warnings',[]))} 則")
          if age>7: print('::warning::匯率資料超過 7 天未更新')
          for w in d.get('warnings',[]): print(f'::warning::{w}')
          PY

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "無變動" && exit 0
          git commit -m "資料更新 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: '.' }
      - id: dep
        uses: actions/deploy-pages@v4
